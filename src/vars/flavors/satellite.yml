---
flavor_features:
  - foreman
  - katello
  - pulp
  - candlepin
  - content/ansible
  - content/container
  - content/rpm
  - ansible
  - azure-rm
  - google
  - remote-execution
  - rh-cloud
  - theme-satellite
  - webhooks
  - hammer
  - foreman-proxy

checks_to_execute:
  - check_features
  - check_hostname
  - check_database_connection
  - check_system_requirements
  - check_podman_network_backend

health_checks_to_execute:
  - check_hostname
  - check_database_connection
  - check_services
  - check_foreman_api
  - check_foreman_tasks
  - check_host_facts_count
  - check_duplicate_permissions

post_install_message_enabled: true

iop_engine_extra_packages:
  - "prodsec.rules"
  - "telemetry.rules.plugins"

iop_vulnerability_taskomatic_jobs: "stale_systems:5,delete_systems:30,cacheman:5,exploit_sync:1440,rules_git_sync:1440"
iop_vulnerability_taskomatic_startup: "cacheman,exploit_sync,rules_git_sync"
