---
foreman:
  description: Base Foreman Server
foreman-proxy:
  description: Base Foreman Proxy
hammer:
  description: Foreman CLI
pulp:
  description: Pulp content management service
  internal: true
candlepin:
  description: Candlepin subscription management service
  internal: true
katello:
  description: Content and Subscription Management plugin for Foreman
  foreman:
    plugin_name: katello
  hammer: katello
  dependencies:
    - name: tasks
    - name: pulp
    - name: candlepin
google:
  description: Google Compute Engine plugin for Foreman
  hammer: foreman_google
  foreman:
    plugin_name: foreman_google
azure-rm:
  description: Azure Resource Manager plugin for Foreman
  hammer: foreman_azure_rm
  foreman:
    plugin_name: foreman_azure_rm
tasks:
  description: Tasks management engine for Foreman
  foreman:
    plugin_name: foreman-tasks
  hammer: foreman_tasks
  internal: true
  dependencies:
    - name: dynflow
remote-execution:
  description: Remote Execution plugin for Foreman
  foreman:
    plugin_name: foreman_remote_execution
  foreman_proxy:
    plugin_name: remote_execution_ssh
  hammer: foreman_remote_execution
  dependencies:
    - name: tasks
ansible:
  description: Ansible plugin for Foreman
  foreman:
    plugin_name: foreman_ansible
  foreman_proxy:
    plugin_name: ansible
  hammer: foreman_ansible
  dependencies:
    - name: remote-execution
dynflow:
  internal: true
  foreman_proxy:
    plugin_name: dynflow
rh-cloud:
  description: Connection to Red Hat Cloud
  foreman:
    plugin_name: foreman_rh_cloud
  hammer: foreman_rh_cloud
  dependencies:
    - name: katello
iop:
  description: iop services
  dependencies:
    - name: rh-cloud
container-gateway:
  description: Container registry gateway for smart proxy
  internal: true
  foreman_proxy:
    plugin_name: container_gateway
bmc:
  description: Power management for bare metal hosts (IPMI, Redfish)
  foreman_proxy:
    plugin_name: bmc
webhooks:
  description: Webhooks plugin for Foreman
  foreman:
    plugin_name: foreman_webhooks
  hammer: foreman_webhooks
templates:
  description: Templates feature for foreman-proxy
  foreman_proxy:
    plugin_name: templates
registration:
  description: Host registration feature for foreman-proxy
  foreman_proxy:
    plugin_name: registration
  dependencies:
    - templates
