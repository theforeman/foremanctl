---
foreman_container_image: "quay.io/foreman/foreman"
foreman_container_tag: "nightly"
foreman_container_name: foreman

foreman_database_name: foreman
foreman_database_user: foreman
# On the shared network, reach Postgres by container name (not host loopback).
foreman_database_host: postgresql
foreman_database_port: 5432
foreman_database_pool: 9
foreman_database_ssl_mode: disable
foreman_database_ssl_ca: # noqa: no-empty-defaults
foreman_database_ssl_ca_path: /etc/foreman/db-ca.crt


foreman_networks:
  - foreman-core-network
foreman_name: "{{ ansible_facts['fqdn'] }}"
foreman_listen_stream: localhost:3000
foreman_url: "http://{{ ansible_facts['fqdn'] }}:3000"
foreman_aliases: []

# Puma threads calculation:
# Max calculation is based on the default for MRI https://puma.io/puma6/#thread-pool
# Min calculation is based on testing that showed that having the same value as the max led to
# lower memory usage
foreman_puma_threads_max: 5
foreman_puma_threads_min: "{{ foreman_puma_threads_max }}"
# Puma workers calculation:
# CPU calculation is based on https://github.com/puma/puma/blob/master/docs/deployment.md#mri
# Memory calculation is based on https://docs.gitlab.com/ee/install/requirements.html#puma-settings
foreman_puma_workers: "{{ [32, ansible_facts['processor_nproc'] * 1.5, (ansible_facts['memtotal_mb'] / 1024) - 1.5] | min | int }}"

foreman_recurring_tasks_enabled: true
foreman_recurring_tasks:
  - instance: hourly
    rake: "cron:hourly"
    schedule: "hourly"
  - instance: daily
    rake: "cron:daily"
    schedule: "daily"
  - instance: weekly
    rake: "cron:weekly"
    schedule: "weekly"
  - instance: monthly
    rake: "cron:monthly"
    schedule: "monthly"

foreman_plugins: []

foreman_env:
  SEED_ORGANIZATION: "{{ foreman_initial_organization }}"
  SEED_LOCATION: "{{ foreman_initial_location }}"
  FOREMAN_ENABLED_PLUGINS: "{{ foreman_plugins | join(' ') }}"
  FOREMAN_LOGGING_LEVEL: "{{ foreman_log_level }}"
  FOREMAN_PUMA_THREADS_MIN: "{{ foreman_puma_threads_min }}"
  FOREMAN_PUMA_THREADS_MAX: "{{ foreman_puma_threads_max }}"
  FOREMAN_PUMA_WORKERS: "{{ foreman_puma_workers }}"

foreman_dynflow_extra_env:
  DYNFLOW_REDIS_URL: "redis://valkey:6379/6"
  REDIS_PROVIDER: "DYNFLOW_REDIS_URL"

foreman_dynflow_env: "{{ foreman_env | ansible.builtin.combine(foreman_dynflow_extra_env) }}"

foreman_secrets:
  - 'foreman-database-url,type=env,target=DATABASE_URL'
  - 'foreman-encryption-key,type=env,target=ENCRYPTION_KEY'
  - 'foreman-seed-admin-user,type=env,target=SEED_ADMIN_USER'
  - 'foreman-seed-admin-password,type=env,target=SEED_ADMIN_PASSWORD'
  - 'foreman-settings-yaml,type=mount,target=/etc/foreman/settings.yaml'
  - 'foreman-katello-yaml,type=mount,target=/etc/foreman/plugins/katello.yaml'
  - 'foreman-ca-cert,type=mount,target=/etc/foreman/katello-default-ca.crt'
  - 'foreman-client-cert,type=mount,target=/etc/foreman/client_cert.pem'
  - 'foreman-client-key,type=mount,target=/etc/foreman/client_key.pem'
  - 'foreman-db-ca,type=mount,target={{ foreman_database_ssl_ca_path }}'

foreman_dynflow_extra_secrets:
  - 'foreman-dynflow-worker-hosts-queue-yaml,type=mount,target=/etc/foreman/dynflow/worker-hosts-queue.yml'

foreman_dynflow_secrets: "{{ foreman_secrets + foreman_dynflow_extra_secrets }}"
