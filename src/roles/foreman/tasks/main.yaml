---
- name: Deploy foreman image
  ansible.builtin.include_tasks: image.yaml

- name: Create secret for DATABASE_URL
  containers.podman.podman_secret:
    state: present
    name: foreman-database-url
    data: "postgresql://{{ foreman_database_user }}:{{ foreman_database_password }}@{{ foreman_database_host }}:{{ foreman_database_port }}/{{ foreman_database_name }}?pool={{ foreman_database_pool }}&sslmode={{ foreman_database_ssl_mode }}{% if foreman_database_ssl_ca is defined %}&sslrootcert={{ foreman_database_ssl_ca_path }}{% endif %}" # yamllint disable-line rule:line-length
  notify:
    - Restart foreman
    - Restart dynflow-sidekiq@

- name: Create secret for SEED_ADMIN_USER
  containers.podman.podman_secret:
    state: present
    name: foreman-seed-admin-user
    data: "{{ foreman_initial_admin_username }}"
  notify:
    - Restart foreman
    - Restart dynflow-sidekiq@

- name: Create secret for SEED_ADMIN_PASSWORD
  containers.podman.podman_secret:
    state: present
    name: foreman-seed-admin-password
    data: "{{ foreman_initial_admin_password }}"
  notify:
    - Restart foreman
    - Restart dynflow-sidekiq@

- name: Create secret for ENCRYPTION_KEY
  containers.podman.podman_secret:
    state: present
    name: foreman-encryption-key
    data: "{{ foreman_encryption_key }}"
  notify:
    - Restart foreman
    - Restart dynflow-sidekiq@

- name: Create settings config secret
  containers.podman.podman_secret:
    state: present
    name: foreman-settings-yaml
    data: "{{ lookup('ansible.builtin.template', 'settings.yaml.j2') }}"
  notify:
    - Restart foreman
    - Restart dynflow-sidekiq@

- name: Create katello config secret
  containers.podman.podman_secret:
    state: present
    name: foreman-katello-yaml
    data: "{{ lookup('ansible.builtin.template', 'katello.yaml.j2') }}"
  notify:
    - Restart foreman
    - Restart dynflow-sidekiq@

- name: Create dynflow hosts_queue worker config secret
  containers.podman.podman_secret:
    state: present
    name: foreman-dynflow-worker-hosts-queue-yaml
    data: "{{ lookup('ansible.builtin.template', 'dynflow-worker-hosts-queue.yml') }}"
  notify:
    - Restart dynflow-sidekiq@

- name: Create the podman secret for Foreman CA certificate
  containers.podman.podman_secret:
    name: foreman-ca-cert
    path: "{{ foreman_ca_certificate }}"
    state: present
  notify:
    - Restart foreman
    - Restart dynflow-sidekiq@

- name: Create the podman secret for Foreman client certificate
  containers.podman.podman_secret:
    state: present
    name: foreman-client-cert
    path: "{{ foreman_client_certificate }}"
  notify:
    - Restart foreman
    - Restart dynflow-sidekiq@

- name: Create the podman secret for Foreman client key
  containers.podman.podman_secret:
    state: present
    name: foreman-client-key
    path: "{{ foreman_client_key }}"
  notify:
    - Restart foreman
    - Restart dynflow-sidekiq@

- name: Create DB SSL cert
  containers.podman.podman_secret:
    state: present
    name: foreman-db-ca
    data: "{{ lookup('ansible.builtin.file', foreman_database_ssl_ca) if foreman_database_ssl_ca else 'empty' }}"
  notify:
    - Restart foreman
    - Restart dynflow-sidekiq@

- name: Deploy Foreman socket
  ansible.builtin.template:
    src: foreman.socket.j2
    dest: /etc/systemd/system/foreman.socket
    mode: '0644'
  notify: Restart foreman socket

- name: Deploy Foreman Container
  containers.podman.podman_container:
    name: "{{ foreman_container_name }}"
    image: foreman.image
    state: quadlet
    sdnotify: true
    network: host
    hostname: "{{ ansible_facts['hostname'] }}.local"
    volume:
      - 'foreman-data-run:/var/run/foreman:rw,z,U'
    secrets: "{{ foreman_secrets }}"
    env: "{{ foreman_env }}"
    quadlet_options:
      - |
        [Unit]
        Requires=foreman.socket
        [Install]
        WantedBy=default.target foreman.target
        [Unit]
        PartOf=foreman.target
        Wants=valkey.service postgresql.service candlepin.service
        After=valkey.service postgresql.service candlepin.service
  notify: Restart foreman

- name: Install foreman-rake wrapper
  ansible.builtin.template:
    src: foreman-rake.j2
    dest: /usr/sbin/foreman-rake
    owner: root
    group: root
    mode: '0755'

- name: Deploy Dynflow Container
  containers.podman.podman_container:
    name: "dynflow-sidekiq-%i"
    quadlet_filename: "dynflow-sidekiq@"
    image: foreman.image
    state: quadlet
    sdnotify: true
    network: host
    hostname: "{{ ansible_facts['hostname'] }}.local"
    volume:
      - 'foreman-data-run:/var/run/foreman:rw,z,U'
    secrets: "{{ foreman_dynflow_secrets }}"
    env: "{{ foreman_dynflow_env }}"
    command: "/usr/libexec/foreman/sidekiq-selinux -e production -r ./extras/dynflow-sidekiq.rb -C /etc/foreman/dynflow/%i.yml"
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target foreman.target
        [Unit]
        PartOf=foreman.target
        Wants=valkey.service postgresql.service
        After=valkey.service postgresql.service
      - |
        [Service]
        Restart=on-failure
        RestartSec=1
  notify:
    - Restart dynflow-sidekiq@

- name: Create Dynflow Container instances
  ansible.builtin.file:
    state: link
    src: "/etc/containers/systemd/dynflow-sidekiq@.container"
    dest: "/etc/containers/systemd/dynflow-sidekiq@{{ item }}.container"
  loop:
    - orchestrator
    - worker
    - worker-hosts-queue

- name: Define templated Quadlet for recurring Foreman rake tasks
  when: foreman_recurring_tasks_enabled
  loop: "{{ foreman_recurring_tasks }}"
  loop_control:
    label: "{{ item.instance }}"
  containers.podman.podman_container:
    name: "foreman-recurring-{{ item.instance }}"
    quadlet_filename: "foreman-recurring@{{ item.instance }}"
    state: quadlet
    image: foreman.image
    sdnotify: false
    network: host
    hostname: "{{ ansible_facts['hostname'] }}.local"
    command: "foreman-rake {{ item.rake }}"
    volume:
      - 'foreman-data-run:/var/run/foreman:rw,z,U'
    secrets: "{{ foreman_secrets }}"
    env: "{{ foreman_env }}"
    quadlet_options:
      - |
        [Unit]
        PartOf=foreman.target
        StartLimitIntervalSec=0
      - |
        [Service]
        TimeoutStartSec=30m
        TimeoutStopSec=2m
        KillMode=mixed
        SyslogIdentifier=foreman-recurring-%i

- name: Render timers for recurring tasks
  when: foreman_recurring_tasks_enabled
  ansible.builtin.template:
    src: foreman-recurring@.timer.j2
    dest: "/etc/systemd/system/foreman-recurring@{{ item.instance }}.timer"
    mode: "0644"
  loop: "{{ foreman_recurring_tasks }}"
  loop_control:
    label: "{{ item.instance }}"

- name: Deploy foreman database migration check container
  containers.podman.podman_container:
    name: foreman-db-migration-check
    state: quadlet
    image: foreman.image
    sdnotify: false
    network: host
    command: bash -c "bin/rails db:abort_if_pending_migrations"
    env: "{{ foreman_env }}"
    secrets: "{{ foreman_secrets }}"
    quadlet_options:
      - |
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        SuccessExitStatus=1
        TimeoutStartSec=30m

- name: Deploy foreman database migration container
  containers.podman.podman_container:
    name: foreman-db-migrate
    state: quadlet
    image: foreman.image
    sdnotify: false
    network: host
    command: bash -c "bin/rails db:migrate"
    env: "{{ foreman_env }}"
    secrets: "{{ foreman_secrets }}"
    quadlet_options:
      - |
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        TimeoutStartSec=30m

- name: Run daemon reload to make Quadlet create the service files
  ansible.builtin.systemd:
    daemon_reload: true

- name: Check for pending Foreman migrations
  ansible.builtin.systemd:
    name: foreman-db-migration-check.service
    state: restarted
  failed_when: false

- name: Get Foreman migration check exit status  # noqa command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl show --property=ExecMainStatus --value foreman-db-migration-check.service
  register: foreman_migration_check_status
  changed_when: false
  failed_when: >-
    foreman_migration_check_status.rc != 0 or
    (foreman_migration_check_status.stdout | trim) not in ['0', '1']

- name: Determine if Foreman migration is needed
  ansible.builtin.set_fact:
    foreman_migration_needed: >-
      {{ (foreman_migration_check_status.stdout | trim | int) == 1 }}

- name: Migrate the Foreman database
  ansible.builtin.systemd:
    name: foreman-db-migrate.service
    state: restarted
  when: foreman_migration_needed

- name: Flush handlers to restart services
  ansible.builtin.meta: flush_handlers

- name: Start services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  async: 60
  poll: 0
  loop:
    - dynflow-sidekiq@orchestrator
    - dynflow-sidekiq@worker
    - dynflow-sidekiq@worker-hosts-queue
    - foreman

- name: Wait for Foreman service to be accessible
  ansible.builtin.uri:
    url: '{{ foreman_url }}/api/v2/ping'
    ca_path: '{{ foreman_ca_certificate }}'
    timeout: 120
  until:
    - foreman_status.status == 200
    - not (enabled_features | has_feature('katello')) or foreman_status.json['results']['katello']['services']['foreman_tasks']['status'] == 'ok'
  retries: 120
  delay: 2
  register: foreman_status

- name: Enable & start recurring timers
  when: foreman_recurring_tasks_enabled
  ansible.builtin.systemd:
    name: "foreman-recurring@{{ item.instance }}.timer"
    enabled: true
    state: started
  loop: "{{ foreman_recurring_tasks }}"
  loop_control:
    label: "{{ item.instance }}"

- name: Warn about unrecognized Pulp Smart Proxy features
  ansible.builtin.debug:
    msg: >-
      Proxy {{ ansible_facts['fqdn'] }}-pulp has features not recognized by Foreman:
      {{ _foreman_pulp_proxy_registration.entity.smart_proxies[0].unrecognized_features | join(', ') }}.
      If these features come from a Smart Proxy plugin, make sure Foreman has the plugin installed too.
  when:
    - _foreman_pulp_proxy_registration.entity.smart_proxies[0].unrecognized_features | default([]) | length > 0
