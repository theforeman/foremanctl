---
- name: Restart foreman socket
  ansible.builtin.systemd:
    name: foreman.socket
    state: restarted

- name: Restart foreman
  ansible.builtin.systemd:
    name: foreman
    state: restarted

- name: Restart dynflow-sidekiq@ instances
  listen: Restart dynflow-sidekiq@
  ansible.builtin.systemd:
    name: "dynflow-sidekiq@{{ item }}"
    state: restarted
  async: 120
  poll: 0
  loop:
    - orchestrator
    - worker
    - worker-hosts-queue
  register: foreman_dynflow_restart

- name: Wait for dynflow-sidekiq@ restart commands
  listen: Restart dynflow-sidekiq@
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: foreman_dynflow_restart_result
  until: foreman_dynflow_restart_result is finished
  retries: 120
  delay: 1
  failed_when:
    - foreman_dynflow_restart_result is failed
    - foreman_dynflow_restart_result.rc is not defined
  loop: "{{ foreman_dynflow_restart.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Wait for dynflow-sidekiq@ instances to become active
  listen: Restart dynflow-sidekiq@
  ansible.builtin.systemd:
    name: "dynflow-sidekiq@{{ item }}"
  register: foreman_dynflow_service
  until:
    - foreman_dynflow_service.status.ActiveState == 'active'
    - foreman_dynflow_service.status.SubState == 'running'
  retries: 120
  delay: 1
  loop:
    - orchestrator
    - worker
    - worker-hosts-queue
