---
- name: Gather package facts
  ansible.builtin.package_facts:

- name: Query container images
  containers.podman.podman_image_info:
  register: backup_container_images_result
  failed_when: false

- name: Build detailed container image list
  ansible.builtin.set_fact:
    backup_container_images_detailed: >-
      {{
        backup_container_images_detailed | default([]) +
        [{
          'name': (item.RepoTags | first) if item.RepoTags | default([]) | length > 0 else '<none>',
          'digest': (item.RepoDigests | first) if item.RepoDigests | default([]) | length > 0 else '',
          'id': item.Id,
          'created': item.Created
        }]
      }}
  loop: "{{ backup_container_images_result.images | default([]) }}"
  when: backup_container_images_result is succeeded
  no_log: true

- name: Check if pulp content was backed up (single volume)
  ansible.builtin.stat:
    path: "{{ backup_dir_full }}/pulp-content.tar.gz"
  register: backup_pulp_content_backup_check
  failed_when: false

- name: Check if pulp content was backed up (multi-volume)
  ansible.builtin.find:
    paths: "{{ backup_dir_full }}"
    patterns: "pulp-content.tar.gz.part*"
  register: backup_pulp_content_volumes_check
  failed_when: false

- name: Get Pulp media storage files (for size calculation)
  ansible.builtin.find:
    paths: "{{ backup_pulp_storage_path }}/media"
    file_type: any
    recurse: true
  register: backup_pulp_storage_files
  when: >
    (backup_pulp_content_backup_check.stat.exists | default(false))
    or (backup_pulp_content_volumes_check.matched | default(0) > 0)

- name: Calculate total Pulp storage size (excluding exports/imports/sync_imports)
  ansible.builtin.set_fact:
    backup_pulp_storage_total_bytes: >-
      {{
        backup_pulp_storage_files.files
        | rejectattr('path', 'search', '/media/exports/')
        | rejectattr('path', 'search', '/media/imports/')
        | rejectattr('path', 'search', '/media/sync_imports/')
        | map(attribute='size')
        | sum
      }}
  when: >
    (backup_pulp_content_backup_check.stat.exists | default(false))
    or (backup_pulp_content_volumes_check.matched | default(0) > 0)

- name: Write metadata file
  ansible.builtin.copy:
    content: "{{ backup_metadata | to_nice_yaml }}"
    dest: "{{ backup_dir_full }}/metadata.yml"
    mode: '0644'
  vars:
    backup_metadata:
      hostname: "{{ ansible_facts['fqdn'] }}"
      os_version: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
      foremanctl_version: "{{ ansible_facts.packages['foremanctl'][0].version | default('unknown') if 'foremanctl' in ansible_facts.packages else 'unknown' }}"
      type: offline
      incremental:
        is_incremental: "{{ (backup_incremental is defined and backup_incremental | length > 0) | bool }}"
        base_backup_dir: "{{ backup_incremental | default('') }}"
        base_backup_timestamp: "{{ (backup_previous_metadata | default({})).timestamp | default('') }}"
      timestamp: "{{ backup_timestamp }}"
      databases: "{{ backup_databases_to_backup }}"
      database_mapping: "{{ backup_databases_config | items2dict(key_name='name', value_name='database') }}"
      enabled_features: "{{ enabled_features | default([]) }}"
      database_mode: "{{ backup_database_mode }}"
      container_images: "{{ backup_container_images_detailed | default([]) }}"
      pulp_storage_size_bytes: "{{ backup_pulp_storage_total_bytes | default(0) }}"
      pulp_volume_count: "{{ backup_pulp_volume_count | default(0) }}"
      pulp_volume_size: "{{ backup_pulp_volume_size | default('') }}"
      backed_up_components: >-
        {{
          [
            'databases',
            'container_images',
            'foremanctl_state'
          ] + (
            ['pulp_content']
            if (backup_pulp_content_backup_check.stat.exists | default(false))
               or (backup_pulp_content_volumes_check.matched | default(0) > 0)
            else []
          )
        }}

- name: Display metadata location
  ansible.builtin.debug:
    msg: "Backup metadata written to {{ backup_dir_full }}/metadata.yml"
