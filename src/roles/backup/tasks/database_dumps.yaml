---
- name: Dump databases
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network=host
      - "--volume={{ backup_dir_full }}:/backup:rw,Z"
      - --env=PGPASSWORD
      - "{{ postgresql_container_image }}:{{ postgresql_container_tag }}"
      - pg_dump
      - "--host={{ item.host }}"
      - "--port={{ item.port }}"
      - "--username={{ item.user }}"
      - --format=custom
      - "--file=/backup/{{ item.database }}.dump"
      - "{{ item.database }}"
  environment:
    PGPASSWORD: "{{ item.password }}"
  loop: "{{ backup_databases_config }}"
  no_log: true
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Gather database dump files
  ansible.builtin.find:
    paths: "{{ backup_dir_full }}"
    patterns: "*.dump"
  register: backup_files

- name: Display backup summary
  ansible.builtin.debug:
    msg: |
      Database dumps completed:
      - Total files: {{ backup_files.matched }}
      - Total size: {{ (backup_files.files | map(attribute='size') | sum) | int | human_readable }}
      - Location: {{ backup_dir_full }}
