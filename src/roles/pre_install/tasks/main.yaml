---
- name: Check if disconnected config file exists
  ansible.builtin.stat:
    path: /etc/foreman/disconnected.conf
  register: disconnected_config_stat

- name: Set disconnected_mode if config file exists
  ansible.builtin.set_fact:
    disconnected_mode: true
  when: disconnected_config_stat.stat.exists

- name: Validate images are available in disconnected mode
  ansible.builtin.shell: podman images | wc -l
  register: podman_images_count
  changed_when: false
  when: disconnected_mode | bool

- name: Fail if no images found in disconnected mode
  ansible.builtin.fail:
    msg: "Error: No container images found. Run prepare_system to import images."
  when:
    - disconnected_mode | bool
    - podman_images_count.stdout | int == 0

- name: Deploy debug_tools
  ansible.builtin.include_role:
    name: debug_tools

- name: 'Enable postgresql:16 module'
  ansible.builtin.command: dnf module enable -y postgresql:16
  # can't use the `dnf` module for modules without a default stream
  # https://github.com/ansible/ansible/issues/56504
  # https://github.com/ansible/ansible/issues/64852
  args:
    creates: /etc/dnf/modules.d/postgresql.module
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_major_version'] == '9'

- name: Install podman and utilities
  ansible.builtin.package:
    name:
      - podman
      - skopeo

- name: Install other dependencies
  ansible.builtin.package:
    name:
      - bash-completion
      - python3-cryptography
      - python3-libsemanage
      - python3-psycopg2
      - python3-requests
      - python3-requests-oauthlib
