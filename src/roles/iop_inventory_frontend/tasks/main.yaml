---
- name: Deploy iop-host-inventory-frontend image
  ansible.builtin.include_tasks: image.yaml

- name: Run daemon reload for image unit
  ansible.builtin.systemd:
    daemon_reload: true

- name: Pull Inventory Frontend image via quadlet unit
  ansible.builtin.systemd:
    name: iop-host-inventory-frontend-image.service
    state: started

- name: Ensure parent assets directory exists
  ansible.builtin.file:
    path: /var/www/iop/assets/apps
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure assets directory exists
  ansible.builtin.file:
    path: "{{ iop_inventory_frontend_assets_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Extract inventory frontend assets from effective image volume
  ansible.builtin.include_role:
    name: iop_frontend_extraction
  vars:
    iop_frontend_extraction_image_unit: iop-host-inventory-frontend
    iop_frontend_extraction_source_volume: iop-host-inventory-frontend-assets-source
    iop_frontend_extraction_source_path: "{{ iop_inventory_frontend_source_path }}"
    iop_frontend_extraction_assets_path: "{{ iop_inventory_frontend_assets_path }}"

- name: Set ownership of inventory frontend assets
  ansible.builtin.file:
    path: "{{ iop_inventory_frontend_assets_path }}"
    owner: root
    group: root
    recurse: true

- name: Ensure Apache SSL config directory exists
  ansible.builtin.file:
    path: /etc/httpd/conf.d/05-foreman-ssl.d
    state: directory
    mode: '0755'

- name: Configure Apache for inventory frontend assets
  ansible.builtin.copy:
    dest: /etc/httpd/conf.d/05-foreman-ssl.d/inventory-frontend.conf
    content: |
      # IOP Inventory Frontend Assets Configuration
      Alias /assets/apps/inventory {{ iop_inventory_frontend_assets_path }}
      ProxyPass /assets/apps/inventory !

      <LocationMatch "^/assets/apps/inventory">
        Options SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted

        # Use standard http expire header for assets instead of ETag
        <IfModule mod_expires.c>
          Header unset ETag
          FileETag None
          ExpiresActive On
          ExpiresDefault "access plus 1 year"
        </IfModule>

        # Return compressed assets if they are precompiled
        RewriteEngine On
        # Make sure the browser supports gzip encoding and file with .gz added
        # does exist on disc before we rewrite with the extension
        RewriteCond %{HTTP:Accept-Encoding} \b(x-)?gzip\b
        RewriteCond %{REQUEST_FILENAME} \.(css|js|svg)$
        RewriteCond %{REQUEST_FILENAME}.gz -s
        RewriteRule ^(.+) $1.gz [L]
      </LocationMatch>
    mode: '0644'
  notify: "httpd : Restart httpd"
