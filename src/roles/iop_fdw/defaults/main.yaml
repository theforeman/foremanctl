---
# Required parameters - must be passed by caller
iop_fdw_database_name: "{{ undef(hint='You must specify the FDW database name') }}"
iop_fdw_database_user: "{{ undef(hint='You must specify the FDW database user') }}"
iop_fdw_remote_database_name: "{{ undef(hint='You must specify the remote FDW database name') }}"
iop_fdw_remote_user: "{{ undef(hint='You must specify the remote FDW database user') }}"
iop_fdw_remote_password: "{{ undef(hint='You must specify the remote FDW database password') }}"

# Optional parameters - can use defaults.
# Use 127.0.0.1: Postgres is published on IPv4 only (not ::1), and TCP
# requires a password now that it is no longer on host networking.
iop_fdw_database_host: "127.0.0.1"
iop_fdw_database_port: 5432
iop_fdw_login_password: "{{ postgresql_admin_password }}"

# Constants - same for all invocations (matching puppet-iop)
iop_fdw_foreign_server_name: hbi_server
iop_fdw_remote_table_schema: inventory
iop_fdw_remote_table_name: hosts
iop_fdw_local_source_schema: inventory_source
iop_fdw_local_view_schema: inventory
iop_fdw_local_view_name: hosts
