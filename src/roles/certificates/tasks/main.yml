---
- name: 'Install crypto dependencies'
  ansible.builtin.package:
    name:
      - python3-cryptography
    state: present

- name: 'Create base directory'
  ansible.builtin.file:
    path: "{{ certificates_ca_directory }}"
    state: directory
    mode: '0755'

- name: 'Create OAuth directory'
  ansible.builtin.file:
    path: "{{ certificates_oauth_directory }}"
    state: directory
    mode: '0755'

- name: 'Create certs directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_certs }}"
    state: directory
    mode: '0755'

- name: 'Create keys directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_keys }}"
    state: directory
    mode: '0755'

- name: 'Create requests directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_requests }}"
    state: directory
    mode: '0755'

- name: 'Generate certificates'
  when:
    - auth_bundle is not defined
    - certificates_generate
  block:
    - name: 'Validate certificate algorithm'
      ansible.builtin.assert:
        that:
          - certificates_algorithm_type in _certificates_supported_algorithms
        fail_msg: >-
          Unsupported certificates_algorithm_type '{{ certificates_algorithm_type }}'.
          Supported algorithms: {{ _certificates_supported_algorithms | join(', ') }}.
        quiet: true

    - name: 'Reject a non-RSA algorithm on a Candlepin deployment'
      ansible.builtin.assert:
        that:
          - certificates_algorithm_type == 'RSA'
        fail_msg: >-
          Candlepin is handed this CA and its legacy crypto scheme signs with
          SHA256withRSA, so it requires an RSA CA. certificates_algorithm_type is
          '{{ certificates_algorithm_type }}'. Set --certificate-algorithm=RSA, or
          deploy a flavor without Candlepin.
        quiet: true
      when:
        - enabled_features | default([]) | has_feature('candlepin')

    - name: 'Generate CA certificate'
      ansible.builtin.include_tasks: ca.yml
      when:
        - certificates_ca

    - name: Issue host certificates
      ansible.builtin.include_tasks: host.yml
      when:
        - certificates_hostnames is defined
      with_items: "{{ certificates_hostnames }}"
      loop_control:
        loop_var: certificates_hostname

    - name: Create CA bundle with internal CA and custom server CA
      ansible.builtin.assemble:
        src: "{{ certificates_ca_directory_certs }}"
        dest: "{{ certificates_ca_directory_certs }}/ca-bundle.crt"
        regexp: '(ca|server-ca)\.crt$'
        mode: '0444'
      when:
        - certificates_source == 'custom_server'

- name: 'Consume certs'
  when:
    - auth_bundle is defined
    - not certificates_generate
  block:
    - name: Extract proxy auth bundle
      ansible.builtin.include_tasks: extract.yml
