---
- name: 'Install crypto dependencies'
  ansible.builtin.package:
    name:
      - python3-cryptography
    state: present

# ML-DSA certificates can only be negotiated over TLS when the system crypto
# policy advertises post-quantum signature algorithms. Where a dedicated PQ
# crypto-policy module ships (e.g. RHEL 9), switch the host to DEFAULT:PQ so the
# containers, which bind-mount /etc/crypto-policies, inherit it. Distributions
# that already enable ML-DSA in their default policy (e.g. CentOS Stream 10) do
# not ship that module, so the switch is skipped there.
- name: 'Enable post-quantum algorithms in the host crypto policy'
  when:
    - certificates_algorithm_type is defined
    - certificates_algorithm_type == 'ML-DSA-87'
  block:
    - name: 'Read the current system crypto policy'
      ansible.builtin.command: update-crypto-policies --show
      register: _certificates_crypto_policy
      changed_when: false

    - name: 'Check for a post-quantum crypto-policy module'
      ansible.builtin.stat:
        path: /usr/share/crypto-policies/policies/modules/PQ.pmod
      register: _certificates_pq_module

    - name: 'Set the system crypto policy to DEFAULT:PQ'
      ansible.builtin.command: update-crypto-policies --set DEFAULT:PQ
      when:
        - _certificates_pq_module.stat.exists
        - "'PQ' not in _certificates_crypto_policy.stdout"
      changed_when: true

- name: 'Create base directory'
  ansible.builtin.file:
    path: "{{ certificates_ca_directory }}"
    state: directory
    mode: '0755'

- name: 'Create OAuth directory'
  ansible.builtin.file:
    path: "{{ certificates_oauth_directory }}"
    state: directory
    mode: '0755'

- name: 'Create certs directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_certs }}"
    state: directory
    mode: '0755'

- name: 'Create keys directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_keys }}"
    state: directory
    mode: '0755'

- name: 'Create requests directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_requests }}"
    state: directory
    mode: '0755'

- name: 'Generate certificates'
  when:
    - auth_bundle is not defined
    - certificates_generate
  block:
    - name: 'Generate CA certificate'
      ansible.builtin.include_tasks: ca.yml
      when:
        - certificates_ca

    - name: Issue host certificates
      ansible.builtin.include_tasks: host.yml
      when:
        - certificates_hostnames is defined
      with_items: "{{ certificates_hostnames }}"
      loop_control:
        loop_var: certificates_hostname

    - name: Create CA bundle with internal CA and custom server CA
      ansible.builtin.assemble:
        src: "{{ certificates_ca_directory_certs }}"
        dest: "{{ certificates_ca_directory_certs }}/ca-bundle.crt"
        regexp: '(ca|server-ca)\.crt$'
        mode: '0444'
      when:
        - certificates_source == 'custom_server'

- name: 'Consume certs'
  when:
    - auth_bundle is defined
    - not certificates_generate
  block:
    - name: Extract proxy auth bundle
      ansible.builtin.include_tasks: extract.yml
