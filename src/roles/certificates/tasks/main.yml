---
- name: 'Require a single certificate algorithm'
  ansible.builtin.assert:
    that:
      - certificates_enabled_algorithms | length == 1
    fail_msg: >-
      Only a single certificate algorithm is supported at the moment.
      `certificates_algorithms` is a list for forwards compatibility
      (future dual-certificate support), but only the primary algorithm is
      used today. You specified: {{ certificates_enabled_algorithms | join(', ') }}.
      Specify exactly one algorithm; use --remove-certificate-algorithm to
      drop the extras.
    quiet: true

- name: 'Install crypto dependencies'
  ansible.builtin.package:
    name:
      - python3-cryptography
    state: present

- name: 'Check ML-DSA crypto capabilities'
  when: certificates_primary_algorithm.startswith('ML-DSA')
  block:
    - name: 'Detect community.crypto collection version'
      ansible.builtin.set_fact:
        certificates_community_crypto_version: "{{ lookup('community.general.collection_version', 'community.crypto') }}"

    - name: 'Require community.crypto 3.3.0 or later for ML-DSA certificates'
      ansible.builtin.assert:
        that:
          - certificates_community_crypto_version is not none
          - certificates_community_crypto_version != '*'
          - certificates_community_crypto_version is version('3.3.0', '>=')
        fail_msg: >-
          ML-DSA certificates require community.crypto >= 3.3.0;
          detected version: {{ certificates_community_crypto_version
            if certificates_community_crypto_version is not none else 'unavailable' }}.
        quiet: true

    - name: 'Gather crypto capabilities'
      community.crypto.crypto_info:
      register: certificates_crypto_info
      check_mode: false

    - name: 'Require python-cryptography 49.0.0 or later for ML-DSA certificates'
      ansible.builtin.assert:
        that:
          - certificates_crypto_info.python_cryptography_installed is true
          - certificates_crypto_info.python_cryptography_capabilities.version is version('49.0.0', '>=')
        fail_msg: >-
          ML-DSA certificates require python-cryptography >= 49.0.0;
          detected version: {{ certificates_crypto_info.python_cryptography_capabilities.version
            if certificates_crypto_info.python_cryptography_installed | default(false) else 'unavailable' }}.
        quiet: true

    - name: 'Require OpenSSL 3.5 or later for ML-DSA certificates'
      ansible.builtin.assert:
        that:
          - certificates_crypto_info.openssl_present is true
          - certificates_crypto_info.openssl.version is version('3.5', '>=')
        fail_msg: >-
          ML-DSA certificates require OpenSSL >= 3.5;
          detected version: {{ certificates_crypto_info.openssl.version
            if certificates_crypto_info.openssl_present | default(false) else 'unavailable' }}.
        quiet: true

- name: 'Create base directory'
  ansible.builtin.file:
    path: "{{ certificates_ca_directory }}"
    state: directory
    mode: '0755'

- name: 'Create OAuth directory'
  ansible.builtin.file:
    path: "{{ certificates_oauth_directory }}"
    state: directory
    mode: '0755'

- name: 'Create certs directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_certs }}"
    state: directory
    mode: '0755'

- name: 'Create keys directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_keys }}"
    state: directory
    mode: '0755'

- name: 'Create requests directory'
  ansible.builtin.file:
    path: "{{ certificates_output_directory_requests }}"
    state: directory
    mode: '0755'

- name: 'Generate certificates'
  when:
    - auth_bundle is not defined
    - certificates_generate
  block:
    - name: 'Generate CA certificate'
      ansible.builtin.include_tasks: ca.yml
      when:
        - certificates_ca

    - name: Issue host certificates
      ansible.builtin.include_tasks: host.yml
      when:
        - certificates_hostnames is defined
      with_items: "{{ certificates_hostnames }}"
      loop_control:
        loop_var: certificates_hostname

    - name: Create CA bundle with internal CA and custom server CA
      ansible.builtin.assemble:
        src: "{{ certificates_ca_directory_certs }}"
        dest: "{{ certificates_ca_directory_certs }}/ca-bundle.crt"
        regexp: '(ca|server-ca)\.crt$'
        mode: '0444'
      when:
        - certificates_source == 'custom_server'

- name: 'Consume certs'
  when:
    - auth_bundle is defined
    - not certificates_generate
  block:
    - name: Extract proxy auth bundle
      ansible.builtin.include_tasks: extract.yml
