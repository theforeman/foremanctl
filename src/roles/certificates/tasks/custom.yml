---
- name: Copy custom server key
  ansible.builtin.copy:
    src: "{{ certificates_custom_server_key }}"
    dest: "{{ certificates_output_directory_keys }}/{{ certificates_hostname }}.key"
    remote_src: true
    mode: '0440'

- name: Copy custom server CA certificate
  ansible.builtin.copy:
    src: "{{ certificates_custom_server_ca_certificate }}"
    dest: "{{ certificates_ca_directory_certs }}/server-ca.crt"
    remote_src: true
    mode: '0444'
  when: certificates_custom_server_ca_certificate is defined

- name: Build fullchain server certificate
  vars:
    _certificates_chain_directory: "{{ certificates_output_directory_certs | dirname }}/fullchain/{{ certificates_hostname }}"
  block:
    - name: Create server certificate fragment directory
      ansible.builtin.file:
        path: "{{ _certificates_chain_directory }}"
        state: directory
        mode: '0755'

    - name: Copy custom server certificate fragment
      ansible.builtin.copy:
        src: "{{ certificates_custom_server_certificate }}"
        dest: "{{ _certificates_chain_directory }}/00-leaf.crt"
        remote_src: true
        mode: '0444'

    # Reuse the deployed server CA chain, including when no new custom CA file was supplied.
    - name: Copy server CA chain fragment
      ansible.builtin.copy:
        src: "{{ certificates_ca_directory_certs }}/server-ca.crt"
        dest: "{{ _certificates_chain_directory }}/01-chain.crt"
        remote_src: true
        mode: '0444'

    - name: Assemble server certificate with leaf before CA chain
      ansible.builtin.assemble:
        src: "{{ _certificates_chain_directory }}"
        dest: "{{ certificates_output_directory_certs }}/{{ certificates_hostname }}.crt"
        regexp: '^(00-leaf|01-chain)\.crt$'
        mode: '0444'
