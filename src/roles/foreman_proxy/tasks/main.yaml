---
- name: Deploy foreman-proxy image
  ansible.builtin.include_tasks: image.yaml

- name: Create config secrets
  ansible.builtin.include_tasks: configs.yaml

- name: Create certs secrets
  ansible.builtin.include_tasks: certs.yaml

- name: Deploy Foreman Proxy Container
  containers.podman.podman_container:
    name: "foreman-proxy"
    image: foreman-proxy.image
    state: quadlet
    sdnotify: true
    network: "{{ foreman_proxy_network }}"
    ports: "{{ foreman_proxy_ports if foreman_proxy_ports | length > 0 else omit }}"
    hostname: "{{ ansible_facts['hostname'] }}.local"
    volume:
      - "/etc/hosts:/etc/hosts:ro"
    secrets:
      - 'foreman-proxy-settings-yml,type=mount,target=/etc/foreman-proxy/settings.yml'
      - 'foreman-proxy-ssl-ca,type=mount,target=/etc/foreman-proxy/ssl_ca.pem'
      - 'foreman-proxy-ssl-cert,type=mount,target=/etc/foreman-proxy/ssl_cert.pem'
      - 'foreman-proxy-ssl-key,type=mount,target=/etc/foreman-proxy/ssl_key.pem'
      - 'foreman-proxy-foreman-ssl-ca,type=mount,target=/etc/foreman-proxy/foreman_ssl_ca.pem'
      - 'foreman-proxy-foreman-ssl-cert,type=mount,target=/etc/foreman-proxy/foreman_ssl_cert.pem'
      - 'foreman-proxy-foreman-ssl-key,type=mount,target=/etc/foreman-proxy/foreman_ssl_key.pem'
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target foreman.target
        [Unit]
        PartOf=foreman.target
  notify: Restart Foreman Proxy

- name: Create foreman-proxy.container.d folder
  ansible.builtin.file:
    path: /etc/containers/systemd/foreman-proxy.container.d
    state: directory
    mode: '0755'
    owner: 'root'
    group: 'root'

- name: Configure features
  ansible.builtin.include_tasks: feature.yaml
  vars:
    feature_enabled: "true"
  loop: "{{ foreman_proxy_features }}"
  loop_control:
    loop_var: feature_name

- name: Disable features
  ansible.builtin.include_tasks: feature.yaml
  vars:
    feature_enabled: "false"
  loop: "{{ foreman_proxy_disabled_features }}"
  loop_control:
    loop_var: feature_name

- name: Run daemon reload to make Quadlet create the service files
  ansible.builtin.systemd:
    daemon_reload: true

- name: Start the Foreman Proxy Service
  ansible.builtin.systemd:
    name: foreman-proxy
    state: started
  register: _foreman_proxy_service

- name: Restart Foreman Proxy ahead of registration
  ansible.builtin.systemd:
    name: foreman-proxy
    state: "{{ (_foreman_proxy_service is changed) | ternary('started', 'restarted') }}"
  # Deliberately NOT done via `notify: Restart Foreman Proxy` + `meta: flush_handlers`
  # here: this role's feature tasks notify "Restart Foreman Proxy" and
  # "Refresh Foreman Proxy" together (matching master), and flush_handlers has no
  # way to flush one without the other. "Refresh Foreman Proxy" calls
  # smart_proxy_refresh, which requires the proxy to already be registered with
  # Foreman - it must not run before "Register Foreman Proxy to Foreman" below.
  # We still need the container running with up-to-date config *before* the
  # readiness check and registration, because - unlike master's host-networking
  # setup - this deployment uses a bridge network, so Foreman can only reach the
  # proxy (and validate it during registration) once the container has actually
  # picked up its current secrets/config. Doing this restart as a plain task
  # sidesteps the handler pair entirely, at the cost of a harmless extra restart
  # when "Restart Foreman Proxy" also fires at the normal end-of-role handler
  # flush below.

- name: Wait for Foreman Proxy API to be reachable from Foreman
  ansible.builtin.include_tasks: wait_for_reachable.yaml

- name: Register Foreman Proxy to Foreman
  theforeman.foreman.smart_proxy:
    name: "{{ foreman_proxy_name }}"
    url: "{{ foreman_proxy_url }}"
    server_url: "{{ foreman_proxy_foreman_server_url }}"
    oauth1_consumer_key: "{{ foreman_proxy_oauth_consumer_key }}"
    oauth1_consumer_secret: "{{ foreman_proxy_oauth_consumer_secret }}"
    ca_path: "{{ foreman_proxy_foreman_ca_certificate | default(omit) }}"

- name: Flush handlers to restart services
  ansible.builtin.meta: flush_handlers
  # This flush restarts the foreman-proxy container again whenever any
  # earlier task (certs/configs/features) notified "Restart Foreman Proxy" -
  # which happens on effectively every deploy run, not just the first one
  # (see the comment above "Restart Foreman Proxy ahead of registration").
  # On the bridge-network setup, that means aardvark-dns needs another
  # moment to reconverge before Foreman can reach the proxy again, so the
  # readiness check below must be repeated here too - otherwise callers
  # that use the proxy immediately after this role returns could hit it
  # before DNS has reconverged.

- name: Wait for Foreman Proxy API to be reachable from Foreman
  ansible.builtin.include_tasks: wait_for_reachable.yaml
