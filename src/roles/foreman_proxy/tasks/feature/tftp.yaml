---
- name: Create TFTP storage
  ansible.builtin.file:
    path: "{{ foreman_proxy_tftp_root }}"
    state: directory
    mode: '0755'
    owner: "{{ foreman_proxy_container_uid }}"
    group: "{{ foreman_proxy_container_gid }}"

- name: Set TFTP storage ownership and permissions
  ansible.builtin.file:
    path: "{{ foreman_proxy_tftp_root }}"
    state: directory
    owner: "{{ foreman_proxy_container_uid }}"
    group: "{{ foreman_proxy_container_gid }}"
    mode: 'u+rwX'
    recurse: true
