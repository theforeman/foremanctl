---
iop_vuln_metadata_downloader_repo_to_cpe_url: "https://security.access.redhat.com/data/metrics/repository-to-cpe.json"
iop_vuln_metadata_downloader_cpe_dict_url: "https://security.access.redhat.com/data/meta/v1/cpe-dictionary.xml"
iop_vuln_metadata_downloader_cvemap_url: "https://security.access.redhat.com/data/meta/v1/cvemap.xml"
iop_vuln_metadata_downloader_output_dir: "/var/www/html/pub"
iop_vuln_metadata_downloader_repo_to_cpe_relative_path: "iop/data/metrics/repository-to-cpe.json"
iop_vuln_metadata_downloader_cpe_dict_relative_path: "iop/data/meta/v1/cpe-dictionary.xml"
iop_vuln_metadata_downloader_cvemap_relative_path: "iop/data/meta/v1/cvemap.xml"
iop_vuln_metadata_downloader_timer_interval: "24h"
iop_vuln_metadata_downloader_client_cert: "/var/lib/foremanctl/certs/certs/{{ ansible_facts['fqdn'] }}-client.crt"
iop_vuln_metadata_downloader_client_key: "/var/lib/foremanctl/certs/private/{{ ansible_facts['fqdn'] }}-client.key"
iop_vuln_metadata_downloader_client_ca: "/var/lib/foremanctl/certs/certs/ca.crt"
