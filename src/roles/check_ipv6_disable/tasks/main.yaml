---
- name: Read kernel command line
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: check_ipv6_disable_cmdline

- name: Assert ipv6.disable=1 is not set at the kernel level
  ansible.builtin.assert:
    that:
      - "'ipv6.disable=1' not in (check_ipv6_disable_cmdline.content | b64decode)"
    fail_msg: >-
      The kernel contains ipv6.disable=1 which is known to break installation
      and upgrade, remove and reboot before continuing.{{
      ' See https://access.redhat.com/solutions/5045841 for more details.'
      if (enabled_features | has_feature('theme-satellite')) else '' }}

- name: Assert the IPv6 loopback (::1) is available
  ansible.builtin.assert:
    that:
      - "'::1' in (ansible_facts.lo.ipv6 | default([]) | map(attribute='address') | list)"
    fail_msg: >-
      The IPv6 loopback address (::1) is not available on this host, which is
      known to break installation and upgrade. Services bind and connect via
      'localhost', which resolves to ::1. Re-enable IPv6 on the loopback and
      retry.
