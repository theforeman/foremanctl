---
cloud_connector_url: "https://{{ ansible_facts['fqdn'] }}"
cloud_connector_service_user: cloud_connector_user
cloud_connector_config_file: /etc/rhc/workers/foreman_rh_cloud.toml
cloud_connector_dispatcher_service: >-
  {{ 'yggdrasil' if (ansible_facts['distribution_major_version'] | int >= 10) else 'rhcd' }}
cloud_connector_worker_service: com.redhat.Yggdrasil1.Worker1.foreman_rh_cloud
cloud_connector_forwarder_executable: /usr/libexec/yggdrasil-worker-forwarder
