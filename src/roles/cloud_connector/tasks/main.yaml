---
- name: Install rhc
  ansible.builtin.package:
    name: rhc

# TODO: drop failed_when and the stat/assert pair below, and fold this back
# into the rhc task, once the yggdrasil-worker-forwarder RPM is published in
# foreman-packaging. Until then the binary may have been put in place by hand
# (make install), so a missing RPM is tolerated but a missing binary is not.
- name: Install yggdrasil-worker-forwarder
  ansible.builtin.package:
    name: yggdrasil-worker-forwarder
  failed_when: false

- name: Check for the yggdrasil-worker-forwarder executable
  ansible.builtin.stat:
    path: "{{ cloud_connector_forwarder_executable }}"
  register: cloud_connector_forwarder_stat

- name: Ensure the yggdrasil-worker-forwarder executable is present
  ansible.builtin.assert:
    that: cloud_connector_forwarder_stat.stat.exists
    fail_msg: >-
      {{ cloud_connector_forwarder_executable }} is missing. The
      yggdrasil-worker-forwarder RPM is not available yet, so install the
      binary manually with 'make install' from
      https://github.com/theforeman/yggdrasil-worker-forwarder before
      enabling the cloud-connector feature.

- name: Create cloud connector service user
  theforeman.foreman.user:
    login: "{{ cloud_connector_service_user }}"
    user_password: "{{ cloud_connector_service_password }}"
    mail: "{{ cloud_connector_service_user }}@localhost"
    auth_source: Internal
    roles:
      - Cloud Connector
    admin: false
    server_url: "{{ cloud_connector_url }}"
    oauth1_consumer_key: "{{ cloud_connector_foreman_oauth_consumer_key }}"
    oauth1_consumer_secret: "{{ cloud_connector_foreman_oauth_consumer_secret }}"
    ca_path: "{{ cloud_connector_foreman_ca_certificate | default(omit) }}"
    state: present

- name: Configure foreman-rh-cloud worker
  ansible.builtin.template:
    src: foreman_rh_cloud.toml.j2
    dest: "{{ cloud_connector_config_file }}"
    owner: root
    group: root
    mode: '0640'
  notify:
    - Restart cloud connector dispatcher
    - Restart cloud connector worker

# Earlier versions of this role wrote a wrapper that set CONFIG_FILE before
# exec'ing the binary. Nothing ever referenced it — the toml's exec= pointed at
# the binary directly — so it is only left over on hosts deployed before now.
- name: Remove obsolete rhcd worker script
  ansible.builtin.file:
    path: /usr/libexec/rhc/foreman-rh-cloud-worker
    state: absent

- name: Ensure cloud connector dispatcher started and enabled
  ansible.builtin.service:
    name: "{{ cloud_connector_dispatcher_service }}"
    state: started
    enabled: true

- name: Ensure cloud connector worker started and enabled
  ansible.builtin.systemd_service:
    name: "{{ cloud_connector_worker_service }}"
    state: started
    enabled: true
    daemon_reload: true
  when: ansible_facts['distribution_major_version'] | int >= 10

- name: Read client ID from consumer certificate
  community.crypto.x509_certificate_info:
    path: /etc/pki/consumer/cert.pem
  register: cloud_connector_cert_info

- name: Announce to Sources
  foremanctl_announce_to_sources:
    server_url: "{{ cloud_connector_url }}"
    oauth1_consumer_key: "{{ cloud_connector_foreman_oauth_consumer_key }}"
    oauth1_consumer_secret: "{{ cloud_connector_foreman_oauth_consumer_secret }}"
    ca_path: "{{ cloud_connector_foreman_ca_certificate | default(omit) }}"
    instance_id: "{{ cloud_connector_cert_info.subject.commonName }}"

- name: Configure HTTP proxy for cloud connector dispatcher
  ansible.builtin.include_tasks: http_proxy.yaml
