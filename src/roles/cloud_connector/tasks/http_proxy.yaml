---
- name: Determine cloud connector services requiring HTTP proxy configuration
  ansible.builtin.set_fact:
    cloud_connector_proxy_services: >-
      {{ [cloud_connector_dispatcher_service] +
         ([cloud_connector_worker_service] if cloud_connector_uses_dbus | bool else []) }}

- name: Deploy HTTP proxy configuration for cloud connector services
  when: cloud_connector_http_proxy is defined
  block:
    - name: Create systemd drop-in directory for cloud connector services
      ansible.builtin.file:
        state: directory
        path: /etc/systemd/system/{{ item }}.service.d
        owner: root
        group: root
        mode: '0755'
      loop: "{{ cloud_connector_proxy_services }}"

    - name: Deploy HTTP proxy systemd drop-in for cloud connector services
      ansible.builtin.template:
        src: proxy.conf.j2
        dest: /etc/systemd/system/{{ item }}.service.d/proxy.conf
        owner: root
        group: root
        mode: '0640'
      loop: "{{ cloud_connector_proxy_services }}"
      notify:
        - Restart cloud connector dispatcher
        - Restart cloud connector worker

- name: Remove HTTP proxy configuration for cloud connector services
  when: cloud_connector_http_proxy is not defined
  block:
    - name: Remove HTTP proxy systemd drop-in for cloud connector services
      ansible.builtin.file:
        path: /etc/systemd/system/{{ item }}.service.d/proxy.conf
        state: absent
      loop: "{{ cloud_connector_proxy_services }}"
      notify:
        - Restart cloud connector dispatcher
        - Restart cloud connector worker

    - name: Check if systemd drop-in directory is empty
      ansible.builtin.find:
        paths: /etc/systemd/system/{{ item }}.service.d
        file_type: any
      register: cloud_connector_dropin_contents
      loop: "{{ cloud_connector_proxy_services }}"

    - name: Remove systemd drop-in directory if empty
      ansible.builtin.file:
        path: /etc/systemd/system/{{ item.item }}.service.d
        state: absent
      loop: "{{ cloud_connector_dropin_contents.results }}"
      when: item.matched == 0
