---
- name: Check if pulp content archive exists (single volume)
  ansible.builtin.stat:
    path: "{{ restore_backup_dir }}/pulp-content.tar.gz"
  register: restore_pulp_content_check

- name: Check if pulp content archive exists (multi-volume)
  ansible.builtin.find:
    paths: "{{ restore_backup_dir }}"
    patterns: "pulp-content.tar.gz.part*"
  register: restore_pulp_content_volumes

- name: Restore pulp content and encryption keys
  when: restore_pulp_content_check.stat.exists or restore_pulp_content_volumes.matched > 0
  block:
    - name: Ensure pulp storage directory exists
      ansible.builtin.file:
        path: "{{ pulp_storage_path }}"
        state: directory
        mode: '0755'

    - name: Remove existing pulp media directory for full restore
      ansible.builtin.file:
        path: "{{ pulp_storage_path }}/media"
        state: absent
      when: not restore_is_incremental

    - name: Extract pulp content archive (compressed multi-volume incremental)  # noqa: risky-shell-pipe
      ansible.builtin.shell:
        cmd: >
          cat {{ restore_backup_dir }}/pulp-content.tar.gz.part* |
          tar -xzf - --listed-incremental=/dev/null -C {{ pulp_storage_path }}
      when:
        - restore_pulp_content_volumes.matched > 0
        - restore_pulp_snar_check.stat.exists
      changed_when: true

    - name: Extract pulp content archive (compressed multi-volume full)  # noqa: risky-shell-pipe
      ansible.builtin.shell:
        cmd: >
          cat {{ restore_backup_dir }}/pulp-content.tar.gz.part* |
          tar -xzf - -C {{ pulp_storage_path }}
      when:
        - restore_pulp_content_volumes.matched > 0
        - not restore_pulp_snar_check.stat.exists
      changed_when: true

    - name: Extract pulp content archive (single volume incremental)  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: >
          tar -xzf "{{ restore_backup_dir }}/pulp-content.tar.gz"
          --listed-incremental=/dev/null
          -C "{{ pulp_storage_path }}"
      when:
        - restore_pulp_content_check.stat.exists
        - restore_pulp_content_volumes.matched == 0
        - restore_pulp_snar_check.stat.exists
      changed_when: true

    - name: Extract pulp content archive (single volume full)
      ansible.builtin.unarchive:
        src: "{{ restore_backup_dir }}/pulp-content.tar.gz"
        dest: "{{ pulp_storage_path }}"
        remote_src: true
      when:
        - restore_pulp_content_check.stat.exists
        - restore_pulp_content_volumes.matched == 0
        - not restore_pulp_snar_check.stat.exists

    - name: Check ownership of restored Pulp content
      ansible.builtin.stat:
        path: "{{ pulp_storage_path }}/media"
      register: restore_pulp_media_ownership

    - name: Fix ownership after restore for non-root containers
      ansible.builtin.file:
        path: "{{ pulp_storage_path }}"
        owner: "700"
        group: "700"
        recurse: true
      when:
        - restore_pulp_media_ownership.stat.exists
        - restore_pulp_media_ownership.stat.uid == 0

    - name: Verify Pulp encryption key was restored
      ansible.builtin.stat:
        path: "{{ pulp_storage_path }}/database_fields.symmetric.key"
      register: restore_pulp_encryption_key
      failed_when: not restore_pulp_encryption_key.stat.exists

    - name: Verify Django secret key was restored
      ansible.builtin.stat:
        path: "{{ pulp_storage_path }}/django_secret_key"
      register: restore_django_secret_key
      failed_when: not restore_django_secret_key.stat.exists

    - name: Count restored media files
      ansible.builtin.find:
        paths: "{{ pulp_storage_path }}/media"
        file_type: file
        recurse: true
      register: restore_pulp_media_files

    - name: Get archive size (single volume)
      ansible.builtin.stat:
        path: "{{ restore_backup_dir }}/pulp-content.tar.gz"
      register: restore_pulp_content_size
      when: restore_pulp_content_volumes.matched == 0

    - name: Display restore completion (multi-volume)
      ansible.builtin.debug:
        msg: >-
          Pulp content restored from {{ restore_pulp_content_volumes.matched }} compressed volumes,
          {{ restore_pulp_media_files.matched }} files restored
      when: restore_pulp_content_volumes.matched > 0

    - name: Display restore completion (single volume)
      ansible.builtin.debug:
        msg: >-
          Pulp content restored from {{ restore_backup_dir }}/pulp-content.tar.gz
          ({{ (restore_pulp_content_size.stat.size / 1024 / 1024) | round(2) }} MB),
          {{ restore_pulp_media_files.matched }} files restored
      when:
        - restore_pulp_content_volumes.matched == 0
        - restore_pulp_content_size is defined
        - restore_pulp_content_size.stat.exists
