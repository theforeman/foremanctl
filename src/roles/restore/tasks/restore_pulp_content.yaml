---
- name: Check if pulp content archive exists
  ansible.builtin.stat:
    path: "{{ backup_dir }}/pulp-content.tar.gz"
  register: restore_pulp_content_check

- name: Restore pulp content and encryption keys
  when: restore_pulp_content_check.stat.exists
  block:
    - name: Ensure pulp storage directory exists
      ansible.builtin.file:
        path: "{{ pulp_storage_path }}"
        state: directory
        mode: '0755'

    - name: Remove existing pulp media directory
      ansible.builtin.file:
        path: "{{ pulp_storage_path }}/media"
        state: absent

    - name: Extract pulp content archive
      ansible.builtin.unarchive:
        src: "{{ backup_dir }}/pulp-content.tar.gz"
        dest: "{{ pulp_storage_path }}"
        remote_src: true

    - name: Check ownership of restored Pulp storage
      ansible.builtin.stat:
        path: "{{ pulp_storage_path }}"
      register: restore_pulp_storage_ownership

    - name: Check ownership of restored Pulp media directory
      ansible.builtin.stat:
        path: "{{ pulp_storage_path }}/media"
      register: restore_pulp_media_ownership

    - name: Migrate restored Pulp storage ownership from root to container user
      ansible.builtin.file:
        path: "{{ pulp_storage_path }}"
        owner: "{{ pulp_container_uid }}"
        group: "{{ pulp_container_gid }}"
        recurse: true
      when:
        - restore_pulp_storage_ownership.stat.exists
        - >-
          restore_pulp_storage_ownership.stat.uid == 0 or
          (
            restore_pulp_media_ownership.stat.exists and
            restore_pulp_media_ownership.stat.uid == 0
          )

    - name: Verify Pulp encryption key was restored
      ansible.builtin.stat:
        path: "{{ pulp_storage_path }}/database_fields.symmetric.key"
      register: restore_pulp_encryption_key
      failed_when: not restore_pulp_encryption_key.stat.exists

    - name: Verify Django secret key was restored
      ansible.builtin.stat:
        path: "{{ pulp_storage_path }}/django_secret_key"
      register: restore_django_secret_key
      failed_when: not restore_django_secret_key.stat.exists

    - name: Set restored secret key file permissions
      ansible.builtin.file:
        path: "{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - "{{ pulp_storage_path }}/django_secret_key"
        - "{{ pulp_storage_path }}/database_fields.symmetric.key"
