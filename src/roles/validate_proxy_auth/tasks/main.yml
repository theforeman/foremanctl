---
- name: Check provided auth bundle path
  ansible.builtin.stat:
    path: "{{ auth_bundle }}"
  register: _validate_proxy_auth_bundle
  delegate_to: localhost
  become: false
  when: auth_bundle is defined

- name: Fail when provided auth bundle does not exist
  ansible.builtin.fail:
    msg: "Path to auth bundle file not found: {{ auth_bundle }}"
  when:
    - auth_bundle is defined
    - not (_validate_proxy_auth_bundle.stat.exists | default(false))

- name: Validate existing proxy authentication state
  when: auth_bundle is not defined
  block:
    - name: Check existing proxy authentication files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ validate_proxy_auth_files }}"
      register: _validate_proxy_auth_files

    - name: Require auth bundle for an uninitialized proxy
      ansible.builtin.assert:
        that:
          - >-
            _validate_proxy_auth_files.results
            | selectattr('stat.exists')
            | list
            | length == _validate_proxy_auth_files.results | length
        fail_msg: >-
          An auth bundle is required because this proxy has not been initialized.
          Missing authentication files: {{
            _validate_proxy_auth_files.results
            | rejectattr('stat.exists')
            | map(attribute='item')
            | join(', ')
          }}.
          Generate a bundle on the Foreman server with foremanctl auth-bundle,
          then retry with --auth-bundle.
