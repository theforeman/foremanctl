---
- name: Reload systemd after removing stale pull overrides
  ansible.builtin.systemd:
    daemon_reload: true
  when: images_air_gapped

- name: Block image pulling in air-gapped mode
  ansible.builtin.fail:
    msg: |
      Image pulling is disabled in air-gapped mode.
      Ensure that all required images are available in local container storage.
  when: images_air_gapped

- name: Pull images
  block:
    - name: Set Policy=always to force image pull
      ansible.builtin.copy:
        dest: "{{ images_quadlet_dir }}/{{ item }}.image.d/00-pull-always.conf"
        content: |
          [Image]
          Policy=always
        mode: "0644"
      loop: "{{ images_deployed_names | default([]) }}"

    - name: Run daemon reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Pull images serially via image services
      ansible.builtin.systemd:
        name: "{{ item }}-image.service"
        state: restarted
      loop: "{{ images_deployed_names | default([]) }}"
      async: "{{ images_pull_timeout + 60 }}"
      poll: 5

  always:
    - name: Remove Policy=always drop-ins
      ansible.builtin.file:
        path: "{{ images_quadlet_dir }}/{{ item }}.image.d/00-pull-always.conf"
        state: absent
      loop: "{{ images_deployed_names | default([]) }}"

    - name: Run daemon reload
      ansible.builtin.systemd:
        daemon_reload: true
