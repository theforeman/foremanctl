---
- name: Deploy iop-ingress image
  ansible.builtin.include_tasks: image.yaml

- name: Create Ingress archive volume
  containers.podman.podman_volume:
    name: "{{ iop_ingress_archive_volume }}"
    state: present
  register: iop_ingress_archive_volume_result

- name: Configure Ingress archive cleanup
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/iop-core-ingress-archives.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      e {{ iop_ingress_archive_volume_result.volume['Mountpoint'] }} - - - {{ iop_ingress_archive_retention }}

- name: Deploy Ingress container
  containers.podman.podman_container:
    name: iop-core-ingress
    image: iop-ingress.image
    state: quadlet
    # Give the bounded in-app HTTP/telemetry shutdown headroom before SIGKILL.
    stop_timeout: 20
    env:
      INGRESS_VALID_UPLOAD_TYPES: "advisor,compliance,qpc,rhv,tower,leapp-reporting,xavier,playbook,playbook-sat,malware-detection,tasks"
      INGRESS_KAFKABROKERS: "iop-core-kafka:9092"
      BOOTSTRAP_SERVERS: "iop-core-kafka:9092"
      INGRESS_STAGERIMPLEMENTATION: "filebased"
      INGRESS_STORAGEFILESYSTEMPATH: "{{ iop_ingress_archive_path }}"
      INGRESS_SERVICEBASEURL: "http://iop-core-ingress:8080"
      INGRESS_WEBPORT: "8080"
      INGRESS_METRICSPORT: "3001"
    volumes:
      - "{{ iop_ingress_archive_volume }}:{{ iop_ingress_archive_path }}:rw"
    network: "{{ foreman_core_network_container_networks }}"
    quadlet_options:
      - |
        [Unit]
        Description=IOP Core Ingress Container
        PartOf=foreman.target
        [Service]
        Restart=on-failure
        [Install]
        WantedBy=default.target foreman.target
  notify: Restart ingress

- name: Run daemon reload to make Quadlet create the service files
  ansible.builtin.systemd:
    daemon_reload: true

- name: Flush handlers to restart services
  ansible.builtin.meta: flush_handlers

- name: Start Ingress service
  ansible.builtin.systemd:
    name: iop-core-ingress
    state: started
