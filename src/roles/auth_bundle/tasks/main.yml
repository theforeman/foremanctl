---
- name: Create output directory
  ansible.builtin.file:
    path: "{{ auth_bundle_output_directory }}"
    state: directory
    mode: '0755'

- name: Check for existing auth bundle
  ansible.builtin.stat:
    path: "{{ auth_bundle_output_directory }}/{{ auth_bundle_filename }}"
  register: _auth_bundle_tarball

- name: Build auth bundle
  when: not _auth_bundle_tarball.stat.exists or (certificates_renew | default(false) | bool)
  block:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        state: directory
        suffix: auth-bundle-build
      register: auth_bundle_build_directory

    - name: Build current auth bundle layout
      ansible.builtin.include_tasks: current.yml
      when: not auth_bundle_legacy

    - name: Build legacy ssl-build layout
      ansible.builtin.include_tasks: legacy.yml
      when: auth_bundle_legacy

    - name: Create tarball
      community.general.archive:
        path: >-
          {{ auth_bundle_build_directory.path }}/{{ 'ssl-build' if auth_bundle_legacy else 'certs/*' }}
        dest: "{{ auth_bundle_output_directory }}/{{ auth_bundle_filename }}"
        format: gz
        mode: '0640'

    - name: Remove temporary directory
      ansible.builtin.file:
        path: "{{ auth_bundle_build_directory.path }}"
        state: absent

- name: Report auth bundle location
  ansible.builtin.debug:
    msg: "Auth bundle created: {{ auth_bundle_output_directory }}/{{ auth_bundle_filename }}"
