---
- name: Check existing Podman networks
  containers.podman.podman_network_info:
  register: _foreman_core_network_networks

- name: Clean up leftover IOP network from previous deploys
  ansible.builtin.include_tasks: cleanup_legacy_iop_network.yaml
  when: >-
    foreman_core_network_legacy_iop_network_name
    in (_foreman_core_network_networks.networks | map(attribute='name') | list)

- name: Check IP support in host
  ansible.builtin.set_fact:
    foreman_core_network_ipv4_available: >-
      {{ (ansible_facts['default_ipv4'] | default({})) is truthy and (ansible_facts['lo']['ipv4'] | default({})) is truthy }}
    foreman_core_network_ipv6_available: >-
      {{ (ansible_facts['default_ipv6'] | default({})) is truthy and (ansible_facts['lo']['ipv6'] | default([])) is truthy }}

- name: Define foreman core container networks
  ansible.builtin.set_fact:
    foreman_core_network_container_networks: >-
      {{
        [foreman_core_network_name]
        +
        ([foreman_core_network_ipv6_name] if foreman_core_network_ipv6_available else [])
      }}

- name: Prevent changing the subnet of an existing foreman-core-network
  vars:
    _foreman_core_network_existing_subnets: >-
      {{ _foreman_core_network_networks.networks
      | selectattr('name', 'equalto', foreman_core_network_name)
      | map(attribute='subnets') | flatten | map(attribute='subnet') | list }}
  ansible.builtin.assert:
    that:
      - >-
        _foreman_core_network_existing_subnets | length == 0
        or foreman_core_network_subnet in _foreman_core_network_existing_subnets
    fail_msg: >-
      {{ foreman_core_network_name }} already exists with a different subnet
      ({{ _foreman_core_network_existing_subnets | join(', ') }}) than requested
      ({{ foreman_core_network_subnet }}). Changing --container-network-ipv4-subnet on an already-deployed
      system is not supported, as recreating the network would fail while its containers are
      still attached. Keep the original subnet, or remove the
      {{ foreman_core_network_name }} Podman network and its containers before changing it.
    quiet: true

- name: Create foreman-core-network
  containers.podman.podman_network:
    name: "{{ foreman_core_network_name }}"
    state: present
    driver: "{{ foreman_core_network_driver }}"
    subnet: "{{ foreman_core_network_subnet }}"
    gateway: "{{ foreman_core_network_gateway }}"
    opt:
      no_default_route: "{{ (not foreman_core_network_ipv4_available)   | string | lower }}"

- name: Prevent changing the subnet of an existing foreman-core-network-ipv6
  vars:
    _foreman_core_network_ipv6_existing_subnets: >-
      {{ _foreman_core_network_networks.networks
      | selectattr('name', 'equalto', foreman_core_network_ipv6_name)
      | map(attribute='subnets') | flatten | map(attribute='subnet') | list }}
  ansible.builtin.assert:
    that:
      - >-
        _foreman_core_network_ipv6_existing_subnets | length == 0
        or foreman_core_network_ipv6_subnet in _foreman_core_network_ipv6_existing_subnets
    fail_msg: >-
      {{ foreman_core_network_ipv6_name }} already exists with a different subnet
      ({{ _foreman_core_network_ipv6_existing_subnets | join(', ') }}) than requested
      ({{ foreman_core_network_ipv6_subnet }}). Changing --container-network-ipv6-subnet on an
      already-deployed system is not supported, as recreating the network would fail while its
      containers are still attached. Keep the original subnet, or remove the
      {{ foreman_core_network_ipv6_name }} Podman network and its containers before changing it.
    quiet: true
  when: foreman_core_network_ipv6_available

- name: Create foreman-core-network-ipv6
  containers.podman.podman_network:
    name: "{{ foreman_core_network_ipv6_name }}"
    state: present
    driver: "{{ foreman_core_network_driver }}"
    subnet: "{{ foreman_core_network_ipv6_subnet }}"
    gateway: "{{ foreman_core_network_ipv6_gateway }}"
  when: foreman_core_network_ipv6_available
