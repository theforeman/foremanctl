---
- name: Deploy iop-compliance images
  ansible.builtin.include_tasks: image.yaml

- name: Create podman secret for compliance database username
  containers.podman.podman_secret:
    name: iop-service-compliance-database-username
    data: "{{ iop_compliance_database_user }}"
  notify: Restart compliance

- name: Create podman secret for compliance database password
  containers.podman.podman_secret:
    name: iop-service-compliance-database-password
    data: "{{ iop_compliance_database_password }}"
  notify: Restart compliance

- name: Create podman secret for compliance database name
  containers.podman.podman_secret:
    name: iop-service-compliance-database-name
    data: "{{ iop_compliance_database_name }}"
  notify: Restart compliance

- name: Create podman secret for compliance database host
  containers.podman.podman_secret:
    name: iop-service-compliance-database-host
    data: "{{ iop_compliance_database_host }}"
  notify: Restart compliance

- name: Create podman secret for compliance database port
  containers.podman.podman_secret:
    name: iop-service-compliance-database-port
    data: "{{ iop_compliance_database_port | string }}"
  notify: Restart compliance

- name: Create podman secret for compliance SECRET_KEY_BASE
  containers.podman.podman_secret:
    name: iop-service-compliance-secret-key-base
    data: "{{ iop_compliance_secret_key_base }}"
  notify: Restart compliance

- name: Deploy Compliance Database Migration Check Container
  containers.podman.podman_container:
    name: iop-service-compliance-db-migration-check
    image: iop-compliance.image
    state: quadlet
    command: sh -c "bundle exec rake db:abort_if_pending_migrations"
    network: "{{ foreman_core_network_container_networks }}"
    volumes: "{{ iop_compliance_database_volumes }}"
    env: "{{ iop_compliance_common_env }}"
    secrets: "{{ iop_compliance_common_secrets }}"
    quadlet_options:
      - "HttpProxy=false"
      - |
        [Unit]
        Description=Compliance Database Migration Check
        After=postgresql.service iop-core-kafka.service
        Wants=postgresql.service iop-core-kafka.service
        StopPropagatedFrom=foreman.target
        [Service]
        Type=oneshot
        RemainAfterExit=true
        SuccessExitStatus=1
        TimeoutStartSec=30m

- name: Deploy Compliance Database Upgrade Init Container
  containers.podman.podman_container:
    name: iop-service-compliance-dbmigrate
    image: iop-compliance.image
    state: quadlet
    command: sh -c "bundle exec rake db:migrate --trace"
    network: "{{ foreman_core_network_container_networks }}"
    volumes: "{{ iop_compliance_database_volumes }}"
    env: "{{ iop_compliance_common_env }}"
    secrets: "{{ iop_compliance_common_secrets }}"
    quadlet_options:
      - "HttpProxy=false"
      - |
        [Unit]
        Description=Compliance Database Upgrade Init Container
        After=postgresql.service iop-core-kafka.service
        Wants=postgresql.service iop-core-kafka.service
        StopPropagatedFrom=foreman.target
        [Service]
        Type=oneshot
        RemainAfterExit=true
        TimeoutStartSec=30m

- name: Deploy Compliance Backend API Container
  containers.podman.podman_container:
    name: iop-service-compliance-backend
    image: iop-compliance.image
    state: quadlet
    network: "{{ foreman_core_network_container_networks }}"
    volumes: "{{ iop_compliance_database_volumes }}"
    env: >-
      {{ iop_compliance_common_env | combine({
        'APPLICATION_TYPE': 'compliance-backend',
        'RAILS_LOGLEVEL': 'info',
        'PUMA_WORKERS': '3',
        'PUMA_MIN_THREADS': '1',
        'PUMA_MAX_THREADS': '3',
        'MALLOC_ARENA_MAX': '2',
      }) }}
    secrets: "{{ iop_compliance_common_secrets }}"
    quadlet_options:
      - "HttpProxy=false"
      - |
        [Unit]
        Description=Compliance Service
        PartOf=foreman.target
        After=iop-service-compliance-dbmigrate.service
        [Service]
        Restart=on-failure
        [Install]
        WantedBy=default.target foreman.target

- name: Deploy Compliance SSG Container
  containers.podman.podman_container:
    name: iop-service-compliance-ssg
    image: iop-compliance-ssg.image
    state: quadlet
    network: "{{ foreman_core_network_container_networks }}"
    quadlet_options:
      - "HttpProxy=false"
      - |
        [Unit]
        Description=Compliance SSG Service
        PartOf=foreman.target
        [Service]
        Restart=on-failure
        ExecStartPost=/usr/bin/podman exec --user root iop-service-compliance-ssg sh -c 'cd /content/playbooks/rhel8 && test -e all || ln -s . all'
        ExecStartPost=/usr/bin/podman exec --user root iop-service-compliance-ssg sh -c 'cd /content/playbooks/rhel9 && test -e all || ln -s . all'
        ExecStartPost=/usr/bin/podman exec --user root iop-service-compliance-ssg sh -c 'cd /content/playbooks/rhel10 && test -e all || ln -s . all'
        [Install]
        WantedBy=default.target foreman.target

- name: Deploy Compliance Inventory Consumer Container
  containers.podman.podman_container:
    name: iop-service-compliance-inventory-consumer
    image: iop-compliance.image
    state: quadlet
    env: >-
      {{ iop_compliance_common_env | combine({
        'APPLICATION_TYPE': 'compliance-inventory',
        'MALLOC_ARENA_MAX': '2',
      }) }}
    secrets: "{{ iop_compliance_common_secrets }}"
    network: "{{ foreman_core_network_container_networks }}"
    volumes: "{{ iop_compliance_database_volumes }}"
    quadlet_options:
      - "HttpProxy=false"
      - |
        [Unit]
        Description=Compliance Inventory Consumer Service
        After=iop-core-kafka.service
        PartOf=foreman.target
        [Service]
        Restart=on-failure
        [Install]
        WantedBy=default.target foreman.target

- name: Deploy Compliance GoodJob Worker Container
  containers.podman.podman_container:
    name: iop-service-compliance-goodjob
    image: iop-compliance.image
    state: quadlet
    env: >-
      {{ iop_compliance_common_env | combine({
        'APPLICATION_TYPE': 'compliance-goodjob',
      }) }}
    secrets: "{{ iop_compliance_common_secrets }}"
    network: "{{ foreman_core_network_container_networks }}"
    volumes: "{{ iop_compliance_database_volumes }}"
    quadlet_options:
      - "HttpProxy=false"
      - |
        [Unit]
        Description=Compliance GoodJob Worker
        PartOf=foreman.target
        [Service]
        Restart=on-failure
        [Install]
        WantedBy=default.target foreman.target

- name: Deploy Compliance Import SSG Container
  containers.podman.podman_container:
    name: iop-service-compliance-import-ssg
    image: iop-compliance.image
    state: quadlet
    env: >-
      {{ iop_compliance_common_env | combine({
        'APPLICATION_TYPE': 'compliance-import-ssg',
      }) }}
    secrets: "{{ iop_compliance_common_secrets }}"
    network: "{{ foreman_core_network_container_networks }}"
    volumes: "{{ iop_compliance_database_volumes }}"
    quadlet_options:
      - "HttpProxy=false"
      - |
        [Unit]
        Description=Compliance Import SSG Job
        Requires=iop-service-compliance-ssg.service
        After=iop-service-compliance-ssg.service
        [Service]
        Type=oneshot

- name: Run daemon reload to make Quadlet create the service files
  ansible.builtin.systemd:
    daemon_reload: true

- name: Check for pending Compliance migrations
  ansible.builtin.systemd:
    name: iop-service-compliance-db-migration-check.service
    state: restarted

- name: Get Compliance migration check exit status  # noqa command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl show --property=ExecMainStatus --value iop-service-compliance-db-migration-check.service
  register: iop_compliance_migration_check_status
  changed_when: false
  failed_when: >-
    iop_compliance_migration_check_status.rc != 0 or
    (iop_compliance_migration_check_status.stdout | trim) not in ['0', '1']

- name: Determine if Compliance migration is needed
  ansible.builtin.set_fact:
    iop_compliance_migration_needed: >-
      {{ (iop_compliance_migration_check_status.stdout | trim | int) == 1 }}

- name: Migrate the Compliance database
  ansible.builtin.systemd:
    name: iop-service-compliance-dbmigrate.service
    state: restarted
  when: iop_compliance_migration_needed
  notify: Restart compliance

- name: Flush handlers to restart services
  ansible.builtin.meta: flush_handlers

- name: Restart Compliance SSG service before importing content
  ansible.builtin.systemd:
    name: iop-service-compliance-ssg.service
    state: restarted

- name: Import Compliance SSG content during deployment
  ansible.builtin.systemd:
    name: iop-service-compliance-import-ssg.service
    state: restarted
