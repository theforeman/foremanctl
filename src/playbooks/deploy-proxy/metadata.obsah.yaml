---
help: |
  Install Proxy

variables:
  flavor:
    help: Base flavor to use in this deployment.
    choices:
      - foreman-proxy-content
  auth_bundle:
    help: Path to the auth bundle tar file.
    type: AbsolutePath
    parameter: --auth-bundle
    persist: false
  foreman_name:
    parameter: --foreman-fqdn
    help: FQDN of the Foreman server this proxy connects to.

constraints:
  required_together:
    - [auth_bundle, foreman_name]
  required_one_of:
    - [auth_bundle, foreman_name]

include:
  - _flavor_features
  - _flavors/foreman-proxy-content
  - _vendor_overrides/deploy-proxy
