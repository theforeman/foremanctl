---
variables:
  certificates_algorithms:
    help: Algorithm used for the private keys of the generated certificates. Changing it on an existing deployment requires --certificate-ca-renew.
    parameter: --add-certificate-algorithm
    action: append_unique
    choices:
      - RSA
      - ECC
      - ML-DSA-87
  remove_certificates_algorithms:
    help: Remove an algorithm from the persisted certificate algorithm list. Changing it on an existing deployment requires --certificate-ca-renew.
    parameter: --remove-certificate-algorithm
    action: remove
    dest: certificates_algorithms
    choices:
      - RSA
      - ECC
      - ML-DSA-87
  certificates_algorithm_rsa_size:
    help: Key size of the generated certificates. Only applies to RSA.
    parameter: --certificate-algorithm-rsa-size
  certificates_algorithm_ecc_curve:
    help: "Elliptic curve of the generated certificates. Only applies to ECC. One of: secp256r1, secp384r1, secp521r1."
    parameter: --certificate-algorithm-ecc-curve
    choices:
      - secp256r1
      - secp384r1
      - secp521r1
