---
variables:
  foreman_proxy_container_gateway_db_max_connections:
    parameter: --container-gateway-database-max-connections
    help: Maximum number of database connections for the container gateway. Defaults to 30.
  foreman_proxy_container_gateway_db_pool_timeout:
    parameter: --container-gateway-database-pool-timeout
    help: Time in seconds to wait for a database connection from the container gateway pool. Defaults to 30.
  foreman_proxy_bmc_ipmi_implementation:
    parameter: --bmc-ipmi-implementation
    help: IPMI implementation to use for BMC.
    choices:
      - freeipmi
      - ipmitool
  foreman_proxy_bmc_redfish_verify_ssl:
    parameter: --bmc-redfish-verify-ssl
    help: Verify SSL certificates for Redfish BMC connections.
    type: Boolean
  foreman_proxy_templates_url:
    parameter: --templates-url
    help: URL that hosts will use to contact the proxy for provisioning templates.
  foreman_proxy_registration_url:
    parameter: --registration-url
    help: URL that hosts use to reach the registration endpoint (e.g. https://loadbalancer.example.com).
  foreman_proxy_dhcp_infoblox_username:
    parameter: --dhcp-infoblox-username
    help: Infoblox username for DHCP management.
  foreman_proxy_dhcp_infoblox_password:
    parameter: --dhcp-infoblox-password
    help: Infoblox password for DHCP management.
  foreman_proxy_dhcp_infoblox_dns_view:
    parameter: --dhcp-infoblox-dns-view
    help: Infoblox DNS view to use for DHCP-managed records.
  foreman_proxy_dhcp_infoblox_network_view:
    parameter: --dhcp-infoblox-network-view
    help: Infoblox network view to use for DHCP.
  foreman_proxy_dhcp_infoblox_record_type:
    parameter: --dhcp-infoblox-record-type
    help: Infoblox record type to create for DHCP leases.
    choices:
      - fixedaddress
      - host
  foreman_proxy_dhcp_infoblox_used_ips_search_type:
    parameter: --dhcp-infoblox-used-ips-search-type
    help: Search type Infoblox uses to determine used IPs.
    choices:
      - record_type
      - used
  foreman_proxy_dns_infoblox_username:
    parameter: --dns-infoblox-username
    help: Infoblox username for DNS management.
  foreman_proxy_dns_infoblox_password:
    parameter: --dns-infoblox-password
    help: Infoblox password for DNS management.
  foreman_proxy_dns_infoblox_dns_view:
    parameter: --dns-infoblox-dns-view
    help: Infoblox DNS view to use.
  foreman_proxy_dns_infoblox_dns_server:
    parameter: --dns-infoblox-dns-server
    help: Infoblox grid DNS server hostname or IP.

constraints:
  required_together:
    - [foreman_proxy_dns_infoblox_dns_server, foreman_proxy_dns_infoblox_username, foreman_proxy_dns_infoblox_password]
