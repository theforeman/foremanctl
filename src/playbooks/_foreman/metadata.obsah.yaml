---
variables:
  foreman_initial_admin_username:
    help: Initial username for the admin user.
    parameter: --initial-admin-username
  foreman_initial_admin_password:
    help: Initial password for the admin user.
    parameter: --initial-admin-password
  foreman_initial_organization:
    help: Name of an initial organization.
    parameter: --initial-organization
  foreman_initial_location:
    help: Name of an initial location.
    parameter: --initial-location
  foreman_puma_workers:
    help: Number of workers for Puma.
  foreman_trusted_proxies:
    help: >-
      IP address or CIDR Foreman should trust for X-Forwarded-For (e.g. Foreman Proxy).
      Can be specified multiple times. Localhost ranges are always included.
    parameter: --foreman-trusted-proxy-add
    type: IP
    action: append_unique
  remove_foreman_trusted_proxies:
    help: >-
      Remove an IP address or CIDR from the persisted trusted proxy list.
      Can be specified multiple times. Localhost ranges are always included;
      proxies discovered from registered Smart Proxies on deploy are not
      controlled by this flag.
    parameter: --foreman-trusted-proxy-remove
    type: IP
    action: remove
    dest: foreman_trusted_proxies

include:
  - _server_aliases
