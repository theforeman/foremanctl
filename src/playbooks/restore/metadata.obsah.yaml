---
help: |
  Restore from a backup

  Validates backup contents, extracts configuration files, restores databases,
  restores content, and redeploys the system.

variables:
  restore_backup_dir:
    parameter: restore_backup_dir
    help: Directory containing the backup files
    type: AbsolutePath
    persist: false

  validate:
    help: Validate backup without making any changes
    action: store_true
    persist: false

  target_host:
    help: Target host to restore (defaults to quadlet)
    persist: false

  force:
    help: Force restore on existing system (bypasses safety check)
    action: store_true
    persist: false

  tar_volume_size:
    parameter: --tar-volume-size
    help: |
      Extract from multi-volume tar archives (informational flag only).
      Value doesn't need to match backup. Automatically detects and handles
      .part0000, .part0001, etc. archive files.
    persist: false
