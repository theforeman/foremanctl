---
help: |
  Create offline backup of databases and configuration

variables:
  backup_dir:
    parameter: backup_dir
    help: Directory where backup files will be stored
    type: AbsolutePath
    persist: false


  target_host:
    help: Target host to backup (defaults to quadlet)
    persist: false

  skip_pulp_content:
    help: Skip Pulp content directory backup
    action: store_true
    persist: false

  wait_for_tasks:
    help: Wait for running tasks to complete instead of failing immediately
    action: store_true
    persist: false

  backup_incremental:
    parameter: --base-backup
    help: |
      Path to base backup directory for incremental backup.
      Creates a differential backup containing only files changed since
      the base backup. Requires .snar files from base backup.
    type: AbsolutePath
    persist: false

  tar_volume_size:
    parameter: --tar-volume-size
    help: |
      Split tar archives into volumes of specified size (e.g., '5G', '100M').
      Creates multi-volume archives: pulp-content.tar.gz.part000000, .part000001, etc.
      See 'man split' SIZE format for valid values.
    persist: false
