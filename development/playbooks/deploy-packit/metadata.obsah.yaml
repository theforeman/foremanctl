---
help: |
  Build Packit PR images for a server and its local proxy, and optionally deploy with --deploy.

  Repeat --foreman-pr-url or --proxy-pr-url to combine core and plugin PRs.
  Existing --pr, --pr-url, and repository options remain supported.
  Normal foremanctl deploy options are accepted directly.
  VMs and package repositories must already be configured.

include:
  - _packit
  - path: ../../../src/playbooks/deploy/metadata.obsah.yaml
    root: ../../../src/playbooks
