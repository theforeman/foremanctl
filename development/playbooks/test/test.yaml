---
- name: Install test dependencies
  hosts:
    - quadlet
  become: true
  tasks:
    - name: Install testing dependencies
      ansible.builtin.package:
        name:
          - nmap

- name: Execute tests
  gather_facts: false
  hosts:
    - localhost
  tasks:
    - name: Run pytest
      ansible.builtin.command:
        cmd: "python -m pytest --durations=10 -vv {{ pytest_args | default() }}"
      args:
        chdir: "{{ inventory_dir }}/../"
      changed_when: false
