---
help: |
  Manage development and testing virtual machines.

variables:
  vm_action:
    parameter: vm_action
    help: Start the virtual machines
    choices:
      - start
      - stop
  vms:
    help: Which VMs to manage, defaults to all.
    action: store
  vm_synced_folder:
    parameter: --synced-folder
    help: Enable or disable /vagrant sharing. Defaults to FOREMANCTL_SYNCED_FOLDER or enabled.
    choices:
      - enabled
      - disabled
    persist: false
